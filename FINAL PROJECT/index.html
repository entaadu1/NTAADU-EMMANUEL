<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Joint - Customizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Burger Joint Customizer</h1>
        <p>Craft your perfect burger layer by layer!</p>
    </header>

    <div class="burger-container">
        
        <section class="customization-section">
            <h2 class="section-title">Build Your Burger</h2>
            
            <form id="burger-form">
        
                <div class="option-group">
                    <h3>1. Choose Patty Type</h3>
                    <div class="radio-options">
                        <label class="option-label">
                            <input type="radio" name="patty_type" value="Beef Patty" data-price="5.50">
                            Beef Patty (+$5.50)
                        </label>
                        <label class="option-label">
                            <input type="radio" name="patty_type" value="Chicken Patty" data-price="4.75">
                            Chicken Patty (+$4.75)
                        </label>
                        <label class="option-label">
                            <input type="radio" name="patty_type" value="Veggie Patty" data-price="4.25">
                            Veggie Patty (+$4.25)
                        </label>
                    </div>
                </div>

                
                <div class="option-group">
                    <h3>2. Choose Cheese</h3>
                    <div class="radio-options">
                        <label class="option-label">
                            <input type="radio" name="cheese_selection" value="Cheddar Cheese" data-price="1.00">
                            Cheddar (+$1.00)
                        </label>
                        <label class="option-label">
                            <input type="radio" name="cheese_selection" value="Swiss Cheese" data-price="1.25">
                            Swiss (+$1.25)
                        </label>
                        <label class="option-label">
                            <input type="radio" name="cheese_selection" value="No Cheese" data-price="0.00">
                            No Cheese ($0.00)
                        </label>
                    </div>
                </div>

               
                <div class="option-group">
                    <h3>3. Select Sauces</h3>
                    <div class="checkbox-options">
                        <label class="option-label">
                            <input type="checkbox" name="sauce_options" value="Classic BBQ Sauce" data-price="0.50">
                            Classic BBQ (+$0.50)
                        </label>
                        <label class="option-label">
                            <input type="checkbox" name="sauce_options" value="Spicy Mayo" data-price="0.50">
                            Spicy Mayo (+$0.50)
                        </label>
                        <label class="option-label">
                            <input type="checkbox" name="sauce_options" value="House Garlic Sauce" data-price="0.75">
                            Garlic Sauce (+$0.75)
                        </label>
                    </div>
                </div>
            </form>
        </section>

   
        <section class="receipt-section">
            <h2 class="section-title">Order Summary</h2>
            <div class="receipt-card">
                <div>
                    <div class="receipt-header">
                        <h4>Burger Receipt</h4>
                        <small>Selected Layers</small>
                    </div>

                    <ul id="burger-layer-list" class="burger-layer-list">
                        <li class="empty-receipt-msg">No options selected yet. Start customizing!</li>
                    </ul>
                </div>

                <div>
                    <div class="receipt-total">
                        <span>Total Cost:</span>
                        <span id="burger-total-price">$0.00</span>
                    </div>
                    <div class="action-buttons">
                        <button id="burger-reset-btn" class="reset-button" type="button">Reset</button>
                        <button id="burger-print-btn" class="print-button" type="button">Print Receipt</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
